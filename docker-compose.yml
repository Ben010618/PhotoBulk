version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kameraph-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kameraph}
      POSTGRES_USER: ${POSTGRES_USER:-kameraph_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kameraph_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kameraph_admin} -d ${POSTGRES_DB:-kameraph}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kameraph-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kameraph-backend:latest
    container_name: kameraph-api
    restart: always
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
      - local_storage:/app/local_storage
      - temp_exports:/app/temp_exports
      - backups:/app/backups
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kameraph_admin}:${POSTGRES_PASSWORD:-kameraph_secure_password_2026}@db:5432/${POSTGRES_DB:-kameraph}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kameraph-network
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: kameraph-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - kameraph-network

volumes:
  postgres_data:
  sqlite_data:
  local_storage:
  temp_exports:
  backups:
  certbot_www:

networks:
  kameraph-network:
    driver: bridge
